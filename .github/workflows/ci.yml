name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hermes_sessions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PG_SESSIONS_URL_TEST: postgresql://postgres:test@localhost:5432/hermes_sessions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Build distribution
        run: python -m build

      - name: Verify wheel ships plugin.yaml
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "pg_sessions/plugin.yaml" in names, "plugin.yaml missing from wheel"
          assert "pg_sessions/__init__.py" in names
          print(f"OK: {wheel} ships {len(names)} entries")
          EOF

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Compile all modules
        run: python -m compileall -q src/pg_sessions
      - name: Validate plugin.yaml
        run: |
          python - <<'EOF'
          import yaml
          data = yaml.safe_load(open("src/pg_sessions/plugin.yaml"))
          assert data["name"] == "pg-sessions"
          assert data["kind"] == "standalone"
          assert "PG_SESSIONS_URL" in data["requires_env"]
          print("plugin.yaml valid")
          EOF
