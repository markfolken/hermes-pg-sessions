[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-pg-sessions"
version = "1.0.0"
description = "PostgreSQL session storage for Hermes Agent — Neon, Supabase, Aiven, RDS, and standard PostgreSQL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mark Folken", email = "markhermes.agent.folken@gmail.com" }]
keywords = ["hermes", "hermes-agent", "plugin", "postgresql", "sessions", "neon", "supabase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/markfolken/hermes-pg-sessions"
Repository = "https://github.com/markfolken/hermes-pg-sessions"
Issues = "https://github.com/markfolken/hermes-pg-sessions/issues"

[project.entry-points."hermes_agent.plugins"]
pg-sessions = "pg_sessions"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_sessions"]

[tool.hatch.build.targets.wheel.force-include]
"src/pg_sessions/plugin.yaml" = "pg_sessions/plugin.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
